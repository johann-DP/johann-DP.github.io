name: CI du site

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Valider le site statique
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Vérifier la structure et les références
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import hashlib
          import json
          import os
          import re
          import sys
          import xml.etree.ElementTree as ET

          root = Path.cwd().resolve()
          errors = []
          required = {
              ".nojekyll",
              "CNAME",
              "index.html",
              "offres.html",
              "methode.html",
              "cas-clients.html",
              "demonstrations.html",
              "demonstrations/fissures.html",
              "demonstrations/nerivane-distribution.html",
              "demonstrations/ormevia-batiment.html",
              "contact.html",
              "assets/css/site.css",
              "assets/css/demonstrations.css",
              "assets/css/demo-fissures.css",
              "assets/css/demo-nerivane.css",
              "assets/css/demo-ormevia.css",
              "assets/data/nerivane-governance-replay.json",
              "assets/data/ormevia-scenarios.json",
              "assets/js/audience-counter.js",
              "assets/js/demo-fissures.js",
              "assets/js/demo-nerivane.js",
              "assets/js/demo-ormevia.js",
              "assets/nerivane-public-v1/SHA256SUMS",
              "assets/nerivane-public-v1/corpus-manifest.json",
              "assets/nerivane-public-v1/reference-registry.json",
              "assets/nerivane-public-v1/references.html",
              "assets/nerivane-public-v1/replay-manifest.json",
              "contracts/nerivane-v2-site-promotion-v1.json",
              "scripts/validate_nerivane_site_state.py",
              "assets/figures/demo-2/content-manifest.json",
              "assets/figures/demo-2/weather/content-manifest.json",
              "assets/img/favicon-datapredict.png",
              "assets/img/logo-datapredict.png",
              "assets/img/social-datapredict.png",
              "robots.txt",
              "sitemap.xml",
          }

          for relative_path in sorted(required):
              if not (root / relative_path).is_file():
                  errors.append(f"fichier obligatoire absent : {relative_path}")

          figure_root = root / "assets/figures/demo-2"
          expected_figure_manifests = {
              "content-manifest.json": "8ab070fb2c2229c6aa28445863beace60f91c1d25936c929b14e660cd49a225d",
              "weather/content-manifest.json": "749bc1ff0279224e348269cb4b0a70c6080840d5ae6c22d09ac2133dcae09c22",
          }
          immutable_figure_html = set()
          expected_figure_files = {
              (figure_root / relative).resolve()
              for relative in expected_figure_manifests
          }
          figure_master_count = 0
          for relative, expected_sha256 in expected_figure_manifests.items():
              manifest_path = figure_root / relative
              if not manifest_path.is_file():
                  continue
              manifest_bytes = manifest_path.read_bytes()
              if hashlib.sha256(manifest_bytes).hexdigest() != expected_sha256:
                  errors.append(f"manifeste de figures modifié : {manifest_path.relative_to(root)}")
                  continue
              try:
                  manifest = json.loads(manifest_bytes.decode("utf-8"))
              except (UnicodeError, json.JSONDecodeError) as exc:
                  errors.append(f"manifeste de figures invalide : {relative} : {exc}")
                  continue
              entries = manifest.get("files")
              if not isinstance(entries, list):
                  errors.append(f"manifeste de figures sans liste de fichiers : {relative}")
                  continue
              for entry in entries:
                  if not isinstance(entry, dict) or set(entry) != {"path", "role", "sha256", "size_bytes"}:
                      errors.append(f"entrée de manifeste invalide : {relative}")
                      continue
                  candidate = (manifest_path.parent / entry["path"]).resolve()
                  try:
                      candidate.relative_to(figure_root.resolve())
                  except ValueError:
                      errors.append(f"chemin de figure hors racine : {entry['path']}")
                      continue
                  expected_figure_files.add(candidate)
                  if not candidate.is_file():
                      errors.append(f"figure absente : {candidate.relative_to(root)}")
                      continue
                  payload = candidate.read_bytes()
                  if len(payload) != entry["size_bytes"]:
                      errors.append(f"taille de figure divergente : {candidate.relative_to(root)}")
                  if hashlib.sha256(payload).hexdigest() != entry["sha256"]:
                      errors.append(f"empreinte de figure divergente : {candidate.relative_to(root)}")
                  if candidate.suffix.lower() in {".html", ".htm"}:
                      immutable_figure_html.add(candidate)
                  if entry["role"] == "responsive_html_master":
                      figure_master_count += 1

          if figure_master_count != 15:
              errors.append(f"15 maîtres HTML attendus, trouvé : {figure_master_count}")
          observed_figure_files = {
              path.resolve() for path in figure_root.rglob("*") if path.is_file()
          }
          if observed_figure_files != expected_figure_files:
              errors.append("le sous-arbre des figures contient un fichier absent des manifestes")

          sensor_figure = figure_root / "retaining-wall-sensor-source-values.html"
          if sensor_figure.is_file():
              sensor_text = sensor_figure.read_text(encoding="utf-8")
              required_sensor_markers = (
                  "temps source naïf — fuseau à confirmer",
                  "valeur source — unité à confirmer",
                  "Aucune correction, conversion, interpolation, jointure, causalité ni diagnostic",
                  'src="weather/assets/plotly-2.35.2.min.js"',
              )
              for marker in required_sensor_markers:
                  if marker not in sensor_text:
                      errors.append(
                          f"figure brute D2-CAP : mention obligatoire absente : {marker}"
                      )
              if re.search(r'(?:src|href)=["\']https?://', sensor_text, re.IGNORECASE):
                  errors.append("figure brute D2-CAP : dépendance réseau interdite")

          counter = root / "assets/js/audience-counter.js"
          if counter.is_file():
              counter_text = counter.read_text(encoding="utf-8")
              endpoint_missing = "__DATAPREDICT_COUNTER_ENDPOINT__" in counter_text
              protected_context = (
                  os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
                  or os.environ.get("GITHUB_REF") == "refs/heads/main"
              )
              if endpoint_missing and protected_context:
                  errors.append(
                      "l’URL HTTPS du compteur doit être configurée avant toute PR ou publication sur main"
                  )

          cname = root / "CNAME"
          if cname.is_file() and cname.read_text(encoding="utf-8").strip() != "www.datapredict.org":
              errors.append("CNAME doit contenir exactement www.datapredict.org")

          robots = root / "robots.txt"
          if robots.is_file() and "Sitemap: https://www.datapredict.org/sitemap.xml" not in robots.read_text(encoding="utf-8"):
              errors.append("robots.txt ne référence pas le sitemap canonique")

          sitemap = root / "sitemap.xml"
          if sitemap.is_file():
              try:
                  ET.parse(sitemap)
              except ET.ParseError as exc:
                  errors.append(f"sitemap.xml invalide : {exc}")

          class Document(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
                  self.ids = set()
                  self.references = []
                  self.script_sources = []
                  self.figure_previews = []
                  self.figure_external_links = []
                  self.figure_card_count = 0
                  self.iframe_count = 0
                  self.h1_count = 0
                  self.title_count = 0
                  self.lang = ""

              def handle_starttag(self, tag, attrs):
                  self._handle_tag(tag, attrs)

              def handle_startendtag(self, tag, attrs):
                  self._handle_tag(tag, attrs)

              def _handle_tag(self, tag, attrs):
                  attributes = dict(attrs)
                  identifier = attributes.get("id")
                  if identifier is not None and not identifier.strip():
                      errors.append(f"{self.path}: identifiant vide")
                  elif identifier:
                      if identifier in self.ids:
                          errors.append(f"{self.path}: identifiant dupliqué #{identifier}")
                      self.ids.add(identifier)

                  if tag == "html":
                      self.lang = attributes.get("lang", "").strip()
                  elif tag == "h1":
                      self.h1_count += 1
                  elif tag == "title":
                      self.title_count += 1
                  elif tag == "script" and attributes.get("src"):
                      self.script_sources.append(attributes["src"].strip())
                  elif tag == "img" and attributes.get("data-figure-id"):
                      self.figure_previews.append(attributes)
                  elif tag == "article" and "fissures-demo__figure-card" in (
                      attributes.get("class", "").split()
                  ):
                      self.figure_card_count += 1
                  elif (
                      tag == "a"
                      and attributes.get("target") == "_blank"
                      and attributes.get("href", "").startswith(
                          "../assets/figures/demo-2/"
                      )
                  ):
                      self.figure_external_links.append(attributes["href"].strip())
                  elif tag == "iframe":
                      self.iframe_count += 1

                  for attribute in ("href", "src"):
                      value = attributes.get(attribute)
                      if value is not None and not value.strip():
                          errors.append(f"{self.path}: attribut {attribute} vide")
                      elif value:
                          self.references.append(value.strip())

          documents = {}
          def ignored_generated_path(path):
              parts = path.relative_to(root).parts
              inactive_demo2_release = parts[:3] == (
                  "assets",
                  "validated-releases",
                  "demo-2",
              )
              inactive_nerivane_v2_release = parts[:3] == (
                  "assets",
                  "validated-releases",
                  "nerivane-v2",
              )
              return inactive_demo2_release or inactive_nerivane_v2_release or any(
                  part.startswith(".") or part == "node_modules" for part in parts
              )

          html_paths = sorted(
              path for path in root.rglob("*.html")
              if not ignored_generated_path(path)
          )

          for path in html_paths:
              relative = path.relative_to(root)
              document = Document(relative)
              try:
                  document.feed(path.read_text(encoding="utf-8"))
                  document.close()
              except (OSError, UnicodeError) as exc:
                  errors.append(f"{relative}: lecture impossible : {exc}")
                  continue

              documents[path.resolve()] = document
              if not document.lang:
                  errors.append(f"{relative}: attribut lang absent sur <html>")
              if document.title_count != 1:
                  errors.append(f"{relative}: {document.title_count} élément(s) <title>, attendu : 1")
              if path.resolve() not in immutable_figure_html and document.h1_count != 1:
                  errors.append(f"{relative}: {document.h1_count} élément(s) <h1>, attendu : 1")
              expected_counter = {
                  "index.html": "assets/js/audience-counter.js",
                  "offres.html": "assets/js/audience-counter.js",
                  "methode.html": "assets/js/audience-counter.js",
                  "cas-clients.html": "assets/js/audience-counter.js",
                  "demonstrations.html": "assets/js/audience-counter.js",
                  "demonstrations/fissures.html": "../assets/js/audience-counter.js",
                  "demonstrations/nerivane-distribution.html": "../assets/js/audience-counter.js",
                  "demonstrations/ormevia-batiment.html": "../assets/js/audience-counter.js",
                  "contact.html": "assets/js/audience-counter.js",
              }.get(relative.as_posix())
              if expected_counter and document.script_sources.count(expected_counter) != 1:
                  errors.append(
                      f"{relative}: le compteur doit être chargé exactement une fois"
                  )

              if relative.as_posix() == "demonstrations/fissures.html":
                  figure_ids = [
                      preview.get("data-figure-id", "").strip()
                      for preview in document.figure_previews
                  ]
                  if len(figure_ids) != 15 or len(set(figure_ids)) != 15:
                      errors.append(
                          "demonstrations/fissures.html: 15 miniatures de figures uniques attendues"
                      )
                  if document.figure_card_count != 15:
                      errors.append(
                          "demonstrations/fissures.html: 15 cartes de figures attendues"
                      )
                  if (
                      len(document.figure_external_links) != 15
                      or len(set(document.figure_external_links)) != 15
                  ):
                      errors.append(
                          "demonstrations/fissures.html: 15 liens plein écran uniques attendus"
                      )
                  if document.iframe_count:
                      errors.append(
                          "demonstrations/fissures.html: aucun iframe ne doit être chargé"
                      )
                  for preview in document.figure_previews:
                      identifier = preview.get("data-figure-id", "").strip()
                      expected_source = (
                          f"../assets/img/demo-2-thumbnails/{identifier}.webp"
                      )
                      if preview.get("src") != expected_source:
                          errors.append(
                              "demonstrations/fissures.html: source de miniature invalide "
                              f"pour {identifier}"
                          )
                      if preview.get("loading") != "lazy":
                          errors.append(
                              "demonstrations/fissures.html: miniature non différée "
                              f"pour {identifier}"
                          )
                      if not preview.get("alt", "").strip():
                          errors.append(
                              "demonstrations/fissures.html: miniature sans texte alternatif "
                              f"pour {identifier}"
                          )

          contact = root / "contact.html"
          if contact.is_file():
              contact_text = contact.read_text(encoding="utf-8")
              obsolete_claims = (
                  "ni traceur publicitaire ni outil de mesure d’audience",
                  "aucune mesure d’audience",
              )
              for claim in obsolete_claims:
                  if claim in contact_text:
                      errors.append(
                          f"contact.html contient encore la mention obsolète : {claim}"
                      )

          catalogue = root / "demonstrations.html"
          if catalogue.is_file():
              catalogue_text = catalogue.read_text(encoding="utf-8")
              start_marker = "<!-- NERIVANE_CATALOGUE_CARD_START -->"
              end_marker = "<!-- NERIVANE_CATALOGUE_CARD_END -->"
              if (
                  catalogue_text.count(start_marker) != 1
                  or catalogue_text.count(end_marker) != 1
                  or catalogue_text.index(start_marker) >= catalogue_text.index(end_marker)
                  or "nerivane-title" not in catalogue_text[
                      catalogue_text.index(start_marker):catalogue_text.index(end_marker)
                  ]
              ):
                  errors.append(
                      "demonstrations.html : bornes exactes de la carte Nérivane absentes"
                  )

          def local_target(source, raw_reference):
              parsed = urlsplit(raw_reference)
              if parsed.scheme or parsed.netloc or raw_reference.startswith("//"):
                  return None, None

              decoded_path = unquote(parsed.path)
              if decoded_path.startswith("/"):
                  candidate = root / decoded_path.lstrip("/")
              elif decoded_path:
                  candidate = source.parent / decoded_path
              else:
                  candidate = source

              candidate = candidate.resolve()
              try:
                  candidate.relative_to(root)
              except ValueError:
                  errors.append(f"{source.relative_to(root)}: référence hors dépôt : {raw_reference}")
                  return None, None

              if decoded_path.endswith("/") or candidate.is_dir():
                  candidate /= "index.html"
              return candidate, unquote(parsed.fragment)

          for source, document in documents.items():
              for reference in document.references:
                  target, fragment = local_target(source, reference)
                  if target is None:
                      continue
                  if not target.is_file():
                      errors.append(
                          f"{source.relative_to(root)}: cible locale absente : {reference}"
                      )
                      continue
                  if fragment and target.suffix.lower() in {".html", ".htm"}:
                      target_document = documents.get(target.resolve())
                      if target_document is None or fragment not in target_document.ids:
                          errors.append(
                              f"{source.relative_to(root)}: ancre absente : {reference}"
                          )

          css_url = re.compile(r"url\(\s*(['\"]?)(.*?)\1\s*\)", re.IGNORECASE)
          for css_path in sorted(root.rglob("*.css")):
              if ignored_generated_path(css_path):
                  continue
              css = css_path.read_text(encoding="utf-8")
              for _, reference in css_url.findall(css):
                  reference = reference.strip()
                  if not reference or reference.startswith(("#", "data:")):
                      continue
                  target, _ = local_target(css_path, reference)
                  if target is not None and not target.is_file():
                      errors.append(
                          f"{css_path.relative_to(root)}: ressource locale absente : {reference}"
                      )

          projection_path = root / "assets/data/ormevia-scenarios.json"
          if projection_path.is_file():
              try:
                  projection = json.loads(projection_path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  errors.append(f"projection Ormévia invalide : {exc}")
              else:
                  scenarios = {
                      scenario.get("id"): scenario
                      for scenario in projection.get("scenarios", [])
                      if isinstance(scenario, dict)
                  }
                  if set(scenarios) != {"standard", "sans-preuve"}:
                      errors.append("projection Ormévia : scénarios inattendus")
                  expected_visibility = {
                      "standard": [False, False, False, False, False, False, True],
                      "sans-preuve": [False, False, False, False, True, True, True],
                  }
                  expected_sources = {
                      "standard": {
                          "sourceSha256": "00213eacb1c158fd63f50ee7195819f0557c1ec4fae69604db539257de549911",
                          "rawSha256": "fecdfae604bb39711ec451f1ca4036099a3af7f0bed8d2c3350d30800c95b93e",
                      },
                      "sans-preuve": {
                          "sourceSha256": "577cac99bc6b668d6d2db18e22a1ca2aff99b2d8d6add788a3b2af7a99de5473",
                          "rawSha256": "52c6379b468ef6dcce963809925c2eb962ecd8ec0cac157926f9d140bc16548f",
                      },
                  }
                  for scenario_id, visibility in expected_visibility.items():
                      scenario = scenarios.get(scenario_id, {})
                      pauses = scenario.get("pauses", [])
                      steps = scenario.get("steps", [])
                      integrity = scenario.get("integrity", {})
                      provenance = scenario.get("provenance", {})
                      observed = [
                          pause.get("portal", {}).get("resultVisible")
                          for pause in pauses
                          if isinstance(pause, dict)
                      ]
                      if len(pauses) != 7 or len(steps) != 7:
                          errors.append(
                              f"projection Ormévia {scenario_id} : sept pauses et étapes attendues"
                          )
                      if integrity.get("manualClickCount") != 7:
                          errors.append(
                              f"projection Ormévia {scenario_id} : sept reprises manuelles attendues"
                          )
                      if observed != visibility:
                          errors.append(
                              f"projection Ormévia {scenario_id} : révélation du résultat incorrecte"
                          )
                      if integrity.get("privacy") != "PASS":
                          errors.append(
                              f"projection Ormévia {scenario_id} : confidentialité non validée"
                          )
                      if provenance.get("classification") != "TEST":
                          errors.append(
                              f"projection Ormévia {scenario_id} : classification TEST absente"
                          )
                      if provenance.get("gitSha") != "675198e5d9cbdede9b42fc590828703c40f1bd95":
                          errors.append(
                              f"projection Ormévia {scenario_id} : commit source inattendu"
                          )
                      for key, expected in expected_sources[scenario_id].items():
                          if provenance.get(key) != expected:
                              errors.append(
                                  f"projection Ormévia {scenario_id} : empreinte {key} inattendue"
                              )

                  if projection.get("fictionNotice") != (
                      "Données entièrement fictives — aucun système client connecté"
                  ):
                      errors.append("projection Ormévia : mention de fiction incorrecte")
                  public_provenance = str(projection.get("publicProvenance", ""))
                  for marker in ("TEST", "corrections éditoriales", "CANONICAL"):
                      if marker.lower() not in public_provenance.lower():
                          errors.append(
                              f"projection Ormévia : provenance publique incomplète ({marker})"
                          )

                  projection_text = projection_path.read_text(encoding="utf-8")
                  forbidden_projection = (
                      "run_id",
                      "session_id",
                      "reset_id",
                      "journey_id",
                      "portal_instance_id",
                      "projection_id",
                      "MISSION-DATA-IA-001",
                      "etat-portail",
                      "Futur bouton",
                      "dossier-postgresql.md",
                  )
                  for forbidden in forbidden_projection:
                      if forbidden.lower() in projection_text.lower():
                          errors.append(
                              f"projection Ormévia : libellé interne interdit : {forbidden}"
                          )
                  if re.search(
                      r"\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b",
                      projection_text,
                      re.IGNORECASE,
                  ):
                      errors.append("projection Ormévia : UUID interdit")

          if errors:
              print("\n".join(f"ERREUR : {error}" for error in errors))
              sys.exit(1)

          print(
              f"Validation réussie : {len(documents)} page(s) HTML, "
              f"{sum(len(document.references) for document in documents.values())} référence(s)."
          )
          PY

      - name: Vérifier le replay Nérivane
        shell: bash
        run: |
          python3 scripts/validate_nerivane_site_state.py
          python3 -m unittest -q tests.test_nerivane_public_replay

      - name: Préparer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: analytics-counter/package-lock.json

      - name: Tester l’attestation et les imports inactifs hors réseau
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/import_demo2_validated_release.py --verify-existing
          python3 scripts/import_nerivane_v2_release.py --verify-existing

      - name: Tester le compteur
        shell: bash
        run: |
          node --check assets/js/audience-counter.js
          node --check assets/js/demo-fissures.js
          node --check assets/js/demo-nerivane.js
          node --check assets/js/demo-ormevia.js
          npm ci --prefix analytics-counter
          npm run check --prefix analytics-counter
          sed 's/__D1_DATABASE_ID__/00000000-0000-0000-0000-000000000000/' \
            analytics-counter/wrangler.toml.template \
            > analytics-counter/wrangler.toml
          cd analytics-counter
          npx wrangler deploy --dry-run --config wrangler.toml
