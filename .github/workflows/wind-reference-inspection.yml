name: Wind visual references - inspection only
on:
  push:
    branches: ['dataviz/wind-memory-20260915']
    paths: ['.github/workflows/wind-reference-inspection.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch public reference video for review only
        shell: bash
        run: |
          mkdir -p wind-reference-inspection
          python3 - <<'PY'
          import json,pathlib,urllib.request
          url='https://dms.licdn.com/playlist/vid/v2/D4E10AQG5zw4jJHCrug/mp4-720p-30fp-crf28/B4EaCenAOFI0Bk-/0/1789367423928?e=2147483647&v=beta&t=e_jipzICqTgWBLxybRq1bvT1hDJp6QAEvl1pN1g-_RI'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
            body=r.read(30_000_000)
            if r.headers.get('Content-Type','').split(';')[0] not in ('video/mp4','application/octet-stream'):raise SystemExit('Not a video')
          pathlib.Path('wind-reference-inspection/reference-review-only.mp4').write_bytes(body)
          print('Reference video bytes:',len(body))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wind-reference-video-review-only
          path: wind-reference-inspection/
          retention-days: 1
