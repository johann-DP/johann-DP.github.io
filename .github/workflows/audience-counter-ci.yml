name: CI du compteur d’audience

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "analytics-counter/**"
      - ".github/workflows/audience-counter-ci.yml"
      - ".github/workflows/audience-counter-deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "analytics-counter/**"
      - ".github/workflows/audience-counter-ci.yml"
      - ".github/workflows/audience-counter-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audience-counter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tester le compteur
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: analytics-counter

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Préparer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: analytics-counter/package-lock.json

      - name: Installer et tester
        run: |
          npm ci
          npm run check

      - name: Valider le paquet Worker
        run: |
          sed \
            's/__D1_DATABASE_ID__/2920ae71-d68b-4b26-99f8-2389b2980997/' \
            wrangler.toml.template > wrangler.toml
          npx wrangler deploy --dry-run --config wrangler.toml
