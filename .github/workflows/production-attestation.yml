name: Attestation de la production

on:
  deployment_status:
  schedule:
    - cron: "17 05 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-attestation
  cancel-in-progress: false

jobs:
  attest:
    name: Comparer la production à l’arbre validé
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment.environment == 'github-pages' &&
      github.event.deployment_status.state == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tester l’attestation hors réseau
        run: python3 -m unittest discover -s tests -p 'test_attest_production.py'

      - name: Attester les fichiers publiés
        run: >-
          python3 scripts/attest_production.py
          --base-url https://www.datapredict.org
          --attempts 2
          --retry-delay-seconds 5
          --timeout-seconds 10
