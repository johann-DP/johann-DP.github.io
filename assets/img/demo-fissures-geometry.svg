  <title id="diagram-title">Élévations vectorielles du bâtiment et du mur routier</title>
  <desc id="diagram-description">Deux élévations régénérées à la même échelle isotrope. La façade
  historique est à gauche. La coupe latérale corrigée est à droite, avec le mur routier
  trapézoïdal. Seul le niveau local de la route est repéré.</desc>
